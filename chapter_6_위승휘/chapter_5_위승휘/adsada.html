<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>16etc_structure</title>

    <style>
        ul{overflow: holdden;}
        li{
            list-style: none;
            float: left; padding: 150px;
        }
        li:first-child{border-start-end-radius: 10px 0 0 10px;}
        li:last-child{border-radius: 0 10px 10px 0;}
        li:nth-child(2n){}
   </style>
</head>
<body>
    <ul>
        <li>첫 번째</li>
        <li>두 번째</li>
        <li>세 번째</li>
        <li>네 번째</li>
        <li>다섯 번째</li>
    </ul>

</body>
</html>
